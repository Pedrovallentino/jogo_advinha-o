<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo da Adivinhação</h1>
        <p>Adivinhe um número entre 1 e 100.</p>
        <p>Tempo restante: <span id="timer">30</span> segundos</p>
        <input type="number" id="guessInput" min="1" max="100" placeholder="Digite seu palpite">
        <button id="submitGuess">Enviar</button>
        <p id="feedback"></p>
        <button id="restartGame" class="hidden">Reiniciar</button>
    </div>


    <script src="index.ts"></script>
</body>
</html>
